<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOO MUCH — Moving Poster Editor</title>
<style>
  :root { color-scheme: light; --page:#f3f4f8; --panel:#fff; --ink:#17213b; --muted:#68738a; --line:#e4e8f0; --blue:#1a3fc4; --pink:#eeb0f0; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; margin:0; }
  body { background:var(--page); color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .app { min-height:100vh; display:flex; align-items:center; justify-content:center; gap:clamp(18px,4vw,54px); padding:28px; }
  .poster-wrap { height:min(86vh, 900px); aspect-ratio:9/16; flex:0 1 auto; display:flex; justify-content:center; align-items:center; min-width:0; }
  #c { width:100%; height:100%; object-fit:contain; aspect-ratio:9/16; display:block; box-shadow:0 18px 55px #18244a20; background:var(--blue); }
  .panel { width:min(350px, 35vw); min-width:270px; background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 14px 45px #18244a0d; }
  .eyebrow { margin:0 0 7px; color:var(--blue); font-size:11px; letter-spacing:.16em; font-weight:800; }
  h1 { margin:0; font-size:24px; letter-spacing:-.045em; }
  .intro { margin:8px 0 24px; color:var(--muted); font-size:13px; line-height:1.55; }
  .section { padding:17px 0; border-top:1px solid var(--line); }
  .section-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; font-size:13px; font-weight:700; }
  output { font-size:12px; color:var(--blue); font-variant-numeric:tabular-nums; }
  input[type="range"] { width:100%; accent-color:var(--blue); cursor:pointer; }
  .range-ends { display:flex; justify-content:space-between; color:#9aa3b4; font-size:10px; margin-top:4px; }
  .colors { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .color-field { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; }
  input[type="color"] { width:38px; height:30px; padding:2px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
  .buttons { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px; }
  button { min-height:42px; border-radius:10px; border:1px solid #d7ddec; background:#fff; color:var(--ink); font-weight:700; font-size:12px; cursor:pointer; padding:10px 12px; transition:transform .12s,opacity .12s; }
  button:hover { transform:translateY(-1px); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.recording { background:#bf2450; border-color:#bf2450; color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .note { color:var(--muted); font-size:11px; line-height:1.55; margin:14px 0 0; }
  .status { min-height:16px; margin-top:10px; font-size:11px; color:var(--blue); line-height:1.45; }
  @media (max-width:720px) {
    .app { min-height:100vh; flex-direction:column; padding:18px 14px 28px; gap:20px; }
    .poster-wrap { height:62vh; max-height:690px; width:auto; max-width:100%; flex:0 1 auto; }
    .panel { width:min(100%,440px); min-width:0; padding:21px; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="poster-wrap" aria-label="애니메이션 포스터 미리보기"><canvas id="c" width="1080" height="1920"></canvas></div>
  <aside class="panel">
    <p class="eyebrow">MOVING POSTER / EDITOR</p>
    <h1>TOO MUCH</h1>
    <p class="intro">움직이는 점 포스터를 원하는 분위기로 조절해 보세요.</p>

    <section class="section">
      <div class="section-head"><label for="speed">애니메이션 속도</label><output id="speedValue">1.0×</output></div>
      <input id="speed" type="range" min="0.1" max="2.5" step="0.1" value="1">
      <div class="range-ends"><span>느리게</span><span>빠르게</span></div>
    </section>

    <section class="section">
      <div class="section-head"><span>컬러</span><span style="font-size:11px;color:#9aa3b4;font-weight:500">실시간 변경</span></div>
      <div class="colors">
        <label class="color-field" for="bgColor">배경 색상<input id="bgColor" type="color" value="#1a3fc4"></label>
        <label class="color-field" for="dotColor">점 색상<input id="dotColor" type="color" value="#eeb0f0"></label>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><label for="dotSize">점 크기</label><output id="sizeValue">1.0×</output></div>
      <input id="dotSize" type="range" min="0.4" max="1.8" step="0.1" value="1">
      <div class="range-ends"><span>작게</span><span>크게</span></div>
    </section>

    <section class="section">
      <div class="section-head"><span>내보내기</span></div>
      <div class="buttons">
        <button id="playBtn" class="primary" type="button">Ⅱ 일시정지</button>
        <button id="pngBtn" type="button">↓ PNG 저장</button>
        <button id="recordBtn" type="button" class="primary">● 영상 녹화</button>
        <button id="resetBtn" type="button">초기화</button>
      </div>
      <p class="note">영상 녹화는 브라우저가 지원하는 WebM 형식으로 저장돼요. 녹화 중 버튼을 다시 누르면 저장이 완료됩니다.</p>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </aside>
</main>
<script>
(() => {
  'use strict';
  const W = 1080, H = 1920, P = 42;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const controls = { speed:$('speed'), bg:$('bgColor'), dot:$('dotColor'), size:$('dotSize') };
  const defaults = { speed:1, bg:'#1a3fc4', dot:'#eeb0f0', size:1 };
  let playing = true, raf = 0, startTime = performance.now(), pausedDuration = 0, pauseStartedAt = 0;
  let recorder = null, chunks = [], recording = false;

  const F = {
    T:['11111','00100','00100','00100','00100','00100','00100'],
    O:['01110','10001','10001','10001','10001','10001','01110'],
    M:['10001','11011','10101','10101','10001','10001','10001'],
    U:['10001','10001','10001','10001','10001','10001','01110'],
    C:['01110','10001','10000','10000','10000','10001','01110'],
    H:['10001','10001','10001','11111','10001','10001','10001']
  };
  const cols = Math.floor(W/P), rows = Math.floor(H/P);
  const ox = (W-cols*P)/2 + P/2, oy = (H-rows*P)/2 + P/2;
  const mask = new Set();
  function put(word, startRow) {
    const width = word.length*5 + (word.length-1);
    let c0 = Math.floor((cols-width)/2);
    for (const ch of word) {
      F[ch].forEach((line,r) => [...line].forEach((v,c) => { if(v==='1') mask.add((c0+c)+','+(startRow+r)); }));
      c0 += 6;
    }
  }
  const start = Math.floor((rows-16)/2);
  put('TOO',start); put('MUCH',start+9);
  const hash = (a,b) => { const x = Math.sin(a*127.1+b*311.7)*43758.5453; return x-Math.floor(x); };
  const dots = [];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
    const h=hash(c,r);
    dots.push({x:ox+c*P,y:oy+r*P,on:mask.has(c+','+r),ph:c*.35+r*.25+h*2.5,type:h<.4?0:h<.65?1:2,sp:1.8+hash(r,c)*1.2});
  }
  function circle(x,y,rad,col) { if(rad<.4)return; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill(); }
  function draw(ms) {
    const clock = playing ? ms : pauseStartedAt;
    const elapsed = Math.max(0, (clock-startTime-pausedDuration)/1000);
    const speed = Number(controls.speed.value), size = Number(controls.size.value);
    const bg = controls.bg.value, pink = controls.dot.value, white = '#ffffff';
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    for(const d of dots) {
      const s=.5+.5*Math.sin(elapsed*speed*d.sp+d.ph);
      const rad=(d.on?P*(.1+.55*s*s):P*(.02+.13*s))*size;
      if(d.type===0) circle(d.x,d.y,rad,pink);
      else if(d.type===1) circle(d.x,d.y,rad*.8,white);
      else { circle(d.x,d.y,rad,pink); circle(d.x,d.y,rad*(.15+.5*(1-s)),white); }
    }
  }
  function frame(now) { draw(now); if(playing) raf=requestAnimationFrame(frame); }
  function setStatus(message) { $('status').textContent=message; }
  function updateLabels() { $('speedValue').textContent=Number(controls.speed.value).toFixed(1)+'×'; $('sizeValue').textContent=Number(controls.size.value).toFixed(1)+'×'; }
  Object.values(controls).forEach(el => el.addEventListener('input',() => { updateLabels(); draw(performance.now()); }));
  $('playBtn').addEventListener('click',() => {
    if(playing) { pauseStartedAt=performance.now(); playing=false; cancelAnimationFrame(raf); $('playBtn').textContent='▶ 재생'; setStatus('애니메이션을 일시정지했어요.'); }
    else { const now=performance.now(); pausedDuration += now-pauseStartedAt; playing=true; $('playBtn').textContent='Ⅱ 일시정지'; raf=requestAnimationFrame(frame); setStatus('애니메이션을 재생 중이에요.'); }
  });
  $('pngBtn').addEventListener('click',() => {
    draw(performance.now());
    cv.toBlob(blob => { if(!blob) { setStatus('PNG 저장에 실패했어요. 다시 시도해 주세요.'); return; } const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='too-much-poster.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); setStatus('PNG 이미지를 저장했어요.'); },'image/png');
  });
  $('resetBtn').addEventListener('click',() => {
    controls.speed.value=defaults.speed; controls.bg.value=defaults.bg; controls.dot.value=defaults.dot; controls.size.value=defaults.size; updateLabels(); draw(performance.now()); setStatus('기본 설정으로 돌아왔어요.');
  });
  $('recordBtn').addEventListener('click',() => {
    if(recording) { recorder.stop(); return; }
    if(!cv.captureStream || !window.MediaRecorder) { setStatus('이 브라우저에서는 영상 녹화를 지원하지 않아요. 최신 Chrome 또는 Edge에서 시도해 주세요.'); return; }
    const stream=cv.captureStream(30);
    const mimeTypes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    const mimeType=mimeTypes.find(type => MediaRecorder.isTypeSupported(type));
    if(!mimeType) { setStatus('지원되는 WebM 녹화 형식을 찾지 못했어요.'); return; }
    chunks=[];
    try { recorder=new MediaRecorder(stream,{mimeType}); }
    catch(e) { setStatus('녹화를 시작하지 못했어요. 브라우저 설정을 확인해 주세요.'); return; }
    recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{ const blob=new Blob(chunks,{type:mimeType}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='too-much-animation.webm'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500); stream.getTracks().forEach(track=>track.stop()); recording=false; $('recordBtn').textContent='● 영상 녹화'; $('recordBtn').classList.remove('recording'); setStatus('영상 파일(WebM)을 저장했어요.'); };
    recorder.start(); recording=true; $('recordBtn').textContent='■ 녹화 종료 및 저장'; $('recordBtn').classList.add('recording'); setStatus('녹화 중이에요. 원하는 길이가 되면 버튼을 다시 눌러 저장하세요.');
  });
  updateLabels(); draw(performance.now()); raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
