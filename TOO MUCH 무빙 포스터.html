<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOO MUCH — 무빙 포스터</title>
<style>
  :root { --page: #f2f2f2; --blue: #1a3fc4; }
  @media (prefers-color-scheme: dark) { :root { --page: #111; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { background: var(--blue); max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1080, H = 1920, P = 42;
const cv = document.getElementById('c');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr;
const ctx = cv.getContext('2d');
ctx.scale(dpr, dpr);

const F = {
  T:['11111','00100','00100','00100','00100','00100','00100'],
  O:['01110','10001','10001','10001','10001','10001','01110'],
  M:['10001','11011','10101','10101','10001','10001','10001'],
  U:['10001','10001','10001','10001','10001','10001','01110'],
  C:['01110','10001','10000','10000','10000','10001','01110'],
  H:['10001','10001','10001','11111','10001','10001','10001']
};
const cols = Math.floor(W / P), rows = Math.floor(H / P);
const ox = (W - cols * P) / 2 + P / 2, oy = (H - rows * P) / 2 + P / 2;
const mask = new Set();
function put(word, startRow) {
  const w = word.length * 5 + (word.length - 1);
  let c0 = Math.floor((cols - w) / 2);
  for (const ch of word) {
    F[ch].forEach((line, r) => [...line].forEach((v, c) => { if (v === '1') mask.add((c0 + c) + ',' + (startRow + r)); }));
    c0 += 6;
  }
}
const start = Math.floor((rows - 16) / 2);
put('TOO', start);
put('MUCH', start + 9);

const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const dots = [];
for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
  const h = hash(c, r);
  dots.push({ x: ox + c * P, y: oy + r * P, on: mask.has(c + ',' + r), ph: c * 0.35 + r * 0.25 + h * 2.5, type: h < 0.4 ? 0 : h < 0.65 ? 1 : 2, sp: 1.8 + hash(r, c) * 1.2 });
}
const PINK = '#eeb0f0', WHITE = '#fff';
function circle(x, y, rad, col) { if (rad < 0.4) return; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.fill(); }

function frame(ms) {
  const t = ms / 1000;
  ctx.fillStyle = '#1a3fc4'; ctx.fillRect(0, 0, W, H);
  for (const d of dots) {
    const s = 0.5 + 0.5 * Math.sin(t * d.sp + d.ph);
    const rad = d.on ? P * (0.1 + 0.55 * s * s) : P * (0.02 + 0.13 * s);
    if (d.type === 0) circle(d.x, d.y, rad, PINK);
    else if (d.type === 1) circle(d.x, d.y, rad * 0.8, WHITE);
    else { circle(d.x, d.y, rad, PINK); circle(d.x, d.y, rad * (0.15 + 0.5 * (1 - s)), WHITE); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
